<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タイ野人のわくわく大冒険</title>
<style>
:root{--bg:#f4efe3;--panel:#fffaf0;--text:#2b2118;--line:#8a6d3b;--hp:#d9534f;--mp:#3b7ddd;--btn:#8a6d3b;--btntext:#fff;--log:#efe6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14080c;--panel:#22101a;--text:#f5e8e8;--line:#e0405a;--btn:#e0405a;--btntext:#fff;--log:#1a0a12}}
:root[data-theme="dark"]{--bg:#14080c;--panel:#22101a;--text:#f5e8e8;--line:#e0405a;--btn:#e0405a;--btntext:#fff;--log:#1a0a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
#game{width:100%;max-width:480px;padding:12px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
#enemy{text-align:center}
#face{font-size:64px;line-height:1.1;transition:transform .15s}
.shake{transform:translateX(8px)}
.bar{height:10px;background:rgba(128,128,128,.3);border-radius:5px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;transition:width .3s}
.hp i{background:var(--hp)}.mp i{background:var(--mp)}
.row{display:flex;justify-content:space-between;font-size:14px}
#log{height:120px;overflow-y:auto;font-size:14px;line-height:1.6;background:var(--log)}
#hero{display:flex;gap:10px}#hero img{width:64px;height:62px;border-radius:8px;object-fit:cover;border:2px solid var(--line)}#hero>div{flex:1}
#st{font-size:12px;min-height:16px;margin-bottom:6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
#sk{max-height:200px;overflow-y:auto;display:none}
button{background:var(--btn);color:var(--btntext);border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:bold;font-family:inherit}
button small{display:block;font-weight:normal;font-size:11px}
button:disabled{opacity:.4}
#grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;max-width:400px;margin:6px auto}#grid i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;border-radius:2px}#dp{display:flex;flex-direction:column;align-items:center;gap:6px}#dp div{display:flex;gap:6px}#dp button{width:64px;height:48px}
@media (orientation:landscape) and (max-height:600px){
#game{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:0 8px;align-items:start;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}
#enemy,#map{grid-column:1;grid-row:1/4}
#log{grid-column:2;grid-row:1;height:80px}
#hbox{grid-column:2;grid-row:2}
#story,#cmd,#dpad,#retry{grid-column:2;grid-row:3}
.box{padding:6px;margin-bottom:6px}
#grid{width:min(100%,calc(100vh - 80px));width:min(100%,calc(100dvh - 80px));max-width:none}
#grid i{font-size:12px}
#face{font-size:44px}
.hint{display:none}
#hero img{width:44px;height:42px}
button{padding:8px;font-size:14px}
#sk{max-height:90px}
#dp{flex-direction:row;justify-content:center}#dp button{width:60px;height:36px}
#cv{width:auto;max-width:100%;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);margin:0 auto}
}
#cv{width:100%;height:auto;display:block;border-radius:6px;background:#000}#dp button{touch-action:none;user-select:none;-webkit-user-select:none}
#fimg{width:100%;max-width:300px;height:min(170px,34vh);object-fit:cover;object-position:50% 25%;border-radius:8px;display:block;margin:0 auto 4px}
.sub{background:transparent;color:var(--text);border:1px dashed var(--line);font-size:12px;padding:8px}
</style></head><body><div id="title" style="position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center"><div style="font-size:44px">👑</div><h1 style="font-size:26px;margin:0">タイ野人の<br>わくわく大冒険</h1><button style="width:min(280px,80%)" onclick="newGame()">はじめから</button><button id="cont" style="width:min(280px,80%)" onclick="loadGame()" disabled>つづきから</button></div><button id="mute" onclick="togMute()" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:20;padding:4px 9px;font-size:16px;opacity:.85">🔊</button><div id="game">
<div class="box" id="enemy"><div class="row"><span id="stg"></span><span id="eel"></span></div><div id="face"></div><div id="ename" style="font-weight:bold"></div><div class="bar hp"><i id="ehp"></i></div><div id="est" style="font-size:12px;min-height:16px"></div></div>
<div class="box" id="map" style="display:none"><div class="row"><b id="mname"></b><span style="font-size:12px">矢印キーでも移動できるよ</span></div><canvas id="cv" width="480" height="352"></canvas>
<div class="hint" style="font-size:12px;margin-top:6px">⛲=泉(全回復) / 🎁=宝箱 / 😎=自分 / ボスは マップの おく</div></div>
<div class="box" id="dpad" style="display:none"><div id="dp"><button onpointerdown="hold(0,-1)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" oncontextmenu="return false">▲</button><div><button onpointerdown="hold(-1,0)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" oncontextmenu="return false">◀</button><button onpointerdown="hold(0,1)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" oncontextmenu="return false">▼</button><button onpointerdown="hold(1,0)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" oncontextmenu="return false">▶</button></div></div><div class="g" style="margin:8px 0 0"><button class="sub" onclick="saveGame()">💾 セーブ</button><button class="sub" onclick="loadGame()">📂 ロード</button></div></div>

let ac,mg,nb,cur='',step=0,nextT=0,muted=false;
function note(m,t,d,w,v){const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.17)}

function tick(){const t=TRK[cur];if(!t||!ac)return;const sd=60/t.bpm/2;
while(nextT<ac.currentTime+.25){const bar=Math.floor(step/8)%t.prog.length,s=step%8,r=t.prog[bar][0],mi=t.prog[bar][1],ch=t.ch||[0,mi?3:4,7,12];
note(r+12+ch[t.lead[s]],nextT,sd*.9,t.ow,.06);if(t.bass[s])note(r-12,nextT,sd*.9,t.bw,.09);
if(t.drum>=1){if(s%4===0||(t.drum>=3&&s%4===2))kick(nextT);if(s===2||s===6)nz(nextT,.1,.18)}
if(t.drum>=2)nz(nextT,.03,.06);
nextT+=sd;step++}}

function sfx(k,dl){if(!ac)return;const t=ac.currentTime+(dl||0);
if(k==='hit'){nz(t,.09,.3);sw(t,420,90,.14,'square',.12)}
else if(k==='hurt'){nz(t,.14,.35);sw(t,180,45,.2,'sawtooth',.16)}

const SKEY='taiyajin_save';
function getSave(){try{return localStorage.getItem(SKEY)}catch(x){return null}}
function showTitle(){bgm('');$('title').style.display='flex';$('cont').disabled=!getSave()}
function newGame(){$('title').style.display='none';start()}
function saveGame(){if(M!=='m'||busy||anim){say('マップで 立ち止まっている時に セーブできる!');return}
try{localStorage.setItem(SKEY,JSON.stringify({h,area,wins,px,py,bseq,b6,op}));say('💾 セーブした!');$('cont').disabled=false}catch(x){say('セーブに しっぱいした…')}}
function loadGame(){const s=getSave();if(!s){say('セーブデータが ない!');return}
let d;try{d=JSON.parse(s)}catch(x){say('セーブデータが こわれている…');return}
h=d.h;area=d.area;wins=d.wins;px=d.px;py=d.py;bseq=d.bseq;b6=d.b6;for(const k in op)delete op[k];Object.assign(op,d.op);
e={n:'',f:'',el:null,hp:1,mhp:1,para:0,deb:0};anim=null;held=null;Q=[];CB=null;lock(false);
$('title').style.display='none';$('story').style.display='none';$('retry').style.display='none';$('log').innerHTML='';
say('📂 ロードした! 第'+area+'章 '+TH[area-1].n+' Lv'+h.lv);ui();mode('m');draw()}
showTitle();

</script></body></html>
